name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  ios-compile:
    name: iOS unsigned compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS runner scaffold
        run: |
          scaffold="$(mktemp -d)"
          flutter create --platforms=ios --project-name=wl1_smart_instructor --org=com.wl1 "$scaffold/app"
          cp -R "$scaffold/app/ios" ./ios
          rm -rf "$scaffold"
      - name: Set minimum iOS version to 16.4 for the local model plugin
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          podfile = Path('ios/Podfile')
          if podfile.exists():
              text = podfile.read_text()
              text = re.sub(r"(?m)^\s*#?\s*platform :ios,.*$", "platform :ios, '16.4'", text)
              podfile.write_text(text)
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = project.read_text()
          text = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 16.4;', text)
          project.write_text(text)
          PYCODE
      - run: flutter pub get
      - run: flutter build ios --no-codesign
